name: Asana to Sheets Sync

on:
  schedule:
    # Runs every 5 minutes. GitHub may delay this by a few minutes under
    # load -- that's normal and out of our control.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab too

concurrency:
  group: asana-sheets-sync
  cancel-in-progress: false  # let a running sync finish; just don't start a second one on top of it

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run sync
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ASANA_PROJECT_ID: ${{ secrets.ASANA_PROJECT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python sync_asana_to_sheets.py